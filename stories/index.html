<!doctype html>
<!-- ai-chat-pages/public/stories/index.html -->
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>LLM-Chat · Mermaid · ЮKassa · SEO</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://lemon1964.github.io/ai-chat-pages/stories/" />
  <link rel="icon" href="./assets/LogoMain-256x256.png" />
  <style>
    :root{
      --bg:#0b0f19;
      --card:#11162a;
      --line:#1d2542;
      --text:#e6e8f2;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu;
    }
    .wrap{
      max-width:1040px;
      margin:40px auto;
      padding:0 16px;
    }
    h1{
      font-size:24px;
      margin:0 0 20px;
    }
    .grid{
      display:grid;
      gap:16px;
      grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    }
    .card{
      display:block;
      border-radius:14px;
      overflow:hidden;
      background:var(--card);
      border:1px solid var(--line);
      text-decoration:none;
      color:inherit;
    }
    .thumb img{
      width:100%;
      height:135px;
      object-fit:cover;
      display:block;
    }
    .meta{
      padding:12px 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .title{
      font-weight:700;
      margin:0;
    }
    .a{
      font-size:14px;
      opacity:.8;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>LLM-Chat · Mermaid · ЮKassa · SEO</h1>

    <section class="grid">
      <a class="card" href="./c3-a-chat.html">
        <span class="thumb">
          <img src="./assets/c3-chat-1200x630.webp" alt="A · Chat">
        </span>
        <div class="meta">
          <p class="title">A · Chat</p>
          <span class="a">Открыть</span>
        </div>
      </a>

      <a class="card" href="./c3-b-mermaid.html">
        <span class="thumb">
          <img src="./assets/c3-mermaid-1200x630.webp" alt="B · Mermaid">
        </span>
        <div class="meta">
          <p class="title">B · Mermaid</p>
          <span class="a">Открыть</span>
        </div>
      </a>

      <a class="card" href="./c3-c-pay.html">
        <span class="thumb">
          <img src="./assets/c3-pay-1200x630.webp" alt="C · Payments">
        </span>
        <div class="meta">
          <p class="title">C · Payments</p>
          <span class="a">Открыть</span>
        </div>
      </a>

      <a class="card" href="./c3-d-seo.html">
        <span class="thumb">
          <img src="./assets/c3-seo-1200x630.webp" alt="D · SEO">
        </span>
        <div class="meta">
          <p class="title">D · SEO</p>
          <span class="a">Открыть</span>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
